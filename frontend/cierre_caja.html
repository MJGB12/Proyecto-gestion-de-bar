<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cierre de Caja - Bar 💸</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <link rel="stylesheet" href="./css/cierre_caja.css">
    
</head>
<body>

    <nav class="navbar navbar-dark px-3 sticky-top">
        <a class="navbar-brand" href="dashboard.html">
                <span class="text-warning">🍹 Panel de Bar</span>
            </a>
        <button id="logout" class="btn btn-danger btn-sm">Cerrar sesión</button> 
    </nav>
    
    <main class="container my-5">
        <div class="page-container">
            
            <h1 class="text-warning text-center mb-4">💰 Cierre de Caja</h1>

            <div class="card shadow-lg p-4 mb-5">
                <h4 class="text-white mb-3">Datos del Cierre</h4>
                
                <form id="formCierre" class="row g-3">
                    
                    <div class="col-md-6">
                        <label for="total_real" class="form-label">Total contado (real):</label>
                        <input type="number" step="0.01" id="total_real" class="form-control" placeholder="$ 0.00" required>
                    </div>

                    <div class="col-md-6">
                        <label for="obs" class="form-label">Observaciones:</label>
                        <textarea id="obs" class="form-control" rows="1" placeholder="Ej: Hubo un pago con billete grande sin cambio, etc."></textarea>
                    </div>

                    <div class="col-12 text-center mt-4">
                        <button type="submit" class="btn btn-warning fw-bold px-5 py-2">Realizar Cierre</button>
                    </div>
                </form>
            </div>

            <h2 class="text-warning mt-4 mb-3">Últimos Cierres Registrados</h2>
            <table class="table table-dark table-striped table-hover shadow-lg" id="tablaCierres">
                <thead class="table-dark">
                    <tr>
                        <th>ID</th>
                        <th>Total sistema</th>
                        <th>Total real</th>
                        <th>Diferencia</th>
                        <th>Fecha</th>
                    </tr>
                </thead>
                <tbody>
                    <tr>
                        <td>C-005</td>
                        <td>$450.00</td>
                        <td>$450.00</td>
                        <td><span class="badge badge-success-dark fw-bold">$0.00</span></td>
                        <td>2025-11-25 23:59</td>
                    </tr>
                    <tr>
                        <td>C-004</td>
                        <td>$320.50</td>
                        <td>$319.00</td>
                        <td><span class="badge badge-danger-dark fw-bold">-$1.50</span></td>
                        <td>2025-11-24 23:59</td>
                    </tr>
                </tbody>
            </table>
            
        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
    <script src="cierre_caja.js"></script>
    <script src="./js/logout.js"></script>
</body>
</html>
