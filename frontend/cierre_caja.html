<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cierre de Caja - Bar 💸</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    
    <style>
        /* Estilos base para el fondo (Imagen y Coherencia) */
        body {
            background-image: url('./img/fondo.jpg'); /* Fondo de imagen de bar */
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            min-height: 100vh;
            color: #ffffff; /* Color de texto base */
        }

        /* 1. Barra de Navegación (Nueva adición para coherencia) */
        .navbar {
            background-color: rgba(10, 10, 10, 0.95) !important; 
            border-bottom: 3px solid #ffc107; /* Acento amarillo */
        }
        .navbar-brand {
            color: #ffc107 !important; 
            font-weight: bold;
        }
        
        /* Contenedor principal de la página (Fondo semitransparente) */
        .page-container {
            background-color: rgba(0, 0, 0, 0.75); /* Fondo negro con buena transparencia */
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 0 20px rgba(0, 0, 0, 0.5); 
        }

        /* 2. Tarjeta del Formulario (Dark) */
        .card {
            background-color: rgba(30, 30, 30, 0.9); /* Fondo de tarjeta oscuro/semi-transparente */
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: #ffffff;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.5);
        }

        /* 3. Estilo para inputs y textareas */
        .form-control, .form-select {
            background-color: rgba(255, 255, 255, 0.1); 
            color: #ffffff;
            border-color: rgba(255, 255, 255, 0.2);
            resize: none; /* Evita que el usuario cambie el tamaño del textarea */
        }
        .form-control:focus {
            background-color: rgba(255, 255, 255, 0.15);
            box-shadow: 0 0 0 0.25rem rgba(255, 193, 7, 0.5); /* Resplandor amarillo */
            border-color: #ffc107;
        }
        .form-label {
            color: #fff;
        }
        
        /* 4. Tabla */
        .table {
            color: white;
            margin-top: 25px;
        }
        .table-dark thead th {
            background-color: #ffc107; /* Encabezado amarillo */
            color: #000000;
            border-color: #ffc107 !important;
        }
        .table-striped > tbody > tr:nth-of-type(odd) > * {
             background-color: rgba(20, 20, 20, 0.9); /* Rayas más oscuras */
        }
        .table-striped > tbody > tr:nth-of-type(even) > * {
             background-color: rgba(30, 30, 30, 0.9);
        }
        
        /* Estilos para badges de Diferencia */
        .badge-success-dark {
            background-color: #198754;
            color: #fff;
        }
        .badge-danger-dark {
            background-color: #dc3545;
            color: #fff;
        }

    </style>
</head>
<body>

    <nav class="navbar navbar-dark px-3 sticky-top">
        <a class="navbar-brand" href="dashboard.html">
                <span class="text-warning">🍹 Panel de Bar</span>
            </a>
        <button id="logout" class="btn btn-danger btn-sm">Cerrar sesión</button> 
    </nav>
    
    <main class="container my-5">
        <div class="page-container">
            
            <h1 class="text-warning text-center mb-4">💰 Cierre de Caja</h1>

            <div class="card shadow-lg p-4 mb-5">
                <h4 class="text-white mb-3">Datos del Cierre</h4>
                
                <form onsubmit="event.preventDefault(); realizarCierre();" class="row g-3">
                    
                    <div class="col-md-6">
                        <label for="total_real" class="form-label">Total contado (real):</label>
                        <input type="number" step="0.01" id="total_real" class="form-control" placeholder="$ 0.00" required>
                    </div>

                    <div class="col-md-6">
                        <label for="obs" class="form-label">Observaciones:</label>
                        <textarea id="obs" class="form-control" rows="1" placeholder="Ej: Hubo un pago con billete grande sin cambio, etc."></textarea>
                    </div>

                    <div class="col-12 text-center mt-4">
                        <button type="submit" class="btn btn-warning fw-bold px-5 py-2">Realizar Cierre</button>
                    </div>
                </form>
            </div>

            <h2 class="text-warning mt-4 mb-3">Últimos Cierres Registrados</h2>
            <table class="table table-dark table-striped table-hover shadow-lg" id="tablaCierres">
                <thead class="table-dark">
                    <tr>
                        <th>ID</th>
                        <th>Total sistema</th>
                        <th>Total real</th>
                        <th>Diferencia</th>
                        <th>Fecha</th>
                    </tr>
                </thead>
                <tbody>
                    <tr>
                        <td>C-005</td>
                        <td>$450.00</td>
                        <td>$450.00</td>
                        <td><span class="badge badge-success-dark fw-bold">$0.00</span></td>
                        <td>2025-11-25 23:59</td>
                    </tr>
                    <tr>
                        <td>C-004</td>
                        <td>$320.50</td>
                        <td>$319.00</td>
                        <td><span class="badge badge-danger-dark fw-bold">-$1.50</span></td>
                        <td>2025-11-24 23:59</td>
                    </tr>
                </tbody>
            </table>
            
        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
    <script src="cierre_caja.js"></script>
    <script>
        // Lógica de logout (manteniendo la coherencia)
        document.getElementById("logout")?.addEventListener("click", () => {
            localStorage.clear();
            window.location.href = "login.html";
        });
        
        // NOTA: La función realizarCierre() debe estar definida en cierre_caja.js
    </script>
</body>
</html>
