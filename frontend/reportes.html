<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reportes de Ventas - Bar 💰</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <link rel="stylesheet" href="./css/reportes.css">
    
</head>
<body>

    <nav class="navbar navbar-dark px-3 sticky-top">
        <a class="navbar-brand" href="dashboard.html">
                <span class="text-warning">🍹 Panel de Bar</span>
            </a>
        <button id="logout" class="btn btn-danger btn-sm">Cerrar sesión</button> 
    </nav>
    
    <main class="container my-5">
        <div class="page-container">
            
            <h1 class="text-warning text-center mb-4">📊 Reporte de Ventas</h1>

            <div class="p-4 mb-4 border-bottom border-secondary">
                <form id="formReporte" class="row g-3 align-items-end justify-content-center">
                    
                    <div class="col-md-3">
                        <label for="fecha_inicio" class="form-label">Fecha inicio:</label>
                        <input type="date" id="fecha_inicio" class="form-control">
                    </div>

                    <div class="col-md-3">
                        <label for="fecha_fin" class="form-label">Fecha fin:</label>
                        <input type="date" id="fecha_fin" class="form-control">
                    </div>

                    <div class="col-md-2 d-grid">
                        <button type="submit" class="btn btn-warning fw-bold">Buscar</button>
                    </div>

                </form>
            </div>

            <h4 class="text-white mb-3">Detalle de Ventas</h4>
            <table class="table table-dark table-striped table-hover shadow-lg" id="tablaVentas">
                <thead class="table-dark">
                    <tr>
                        <th>ID Venta</th>
                        <th>Total</th>
                        <th>Fecha</th>
                        <th>Cajero</th>
                    </tr>
                </thead>
                <tbody>
                    <tr>
                        <td>VNT-00123</td>
                        <td>$85.50</td>
                        <td>2025-11-25 20:30</td>
                        <td>Ana</td>
                    </tr>
                    <tr>
                        <td>VNT-00124</td>
                        <td>$12.00</td>
                        <td>2025-11-26 01:15</td>
                        <td>Carlos</td>
                    </tr>
                </tbody>
            </table>

            <div class="d-flex justify-content-end pt-3">
                <button type="button" id="btnCSV" class="btn btn-outline-warning me-2 fw-bold">📥 CSV</button>
                <button type="button" id="btnPDF" class="btn btn-danger fw-bold">📥 PDF</button>
            </div>

        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
    <script src="reportes.js"></script>
    <script src="./js/logout.js"></script>
</body>
</html>
