<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Gestión de Pedidos - Bar 📋</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <style>
    /* estilos existentes) */
    body { background-image: url('./img/fondo.jpg'); background-size: cover; background-position: center; background-attachment: fixed; min-height:100vh; color:#fff; }
    .navbar { background-color: rgba(10,10,10,0.95) !important; border-bottom:3px solid #ffc107; }
    .page-container { background-color: rgba(0,0,0,0.75); padding:30px; border-radius:10px; }
    .card { background-color: rgba(30,30,30,0.9); color:#fff; }
    .form-control, .form-select { background-color: rgba(255,255,255,0.08); color:#fff; border-color: rgba(255,255,255,0.12); }
    .list-group-item { background-color: rgba(50,50,50,0.9); color:#fff; border-color: rgba(255,255,255,0.08); }
    .table-dark thead th { background-color:#ffc107; color:#000; }

    /* ==== MODO OSCURO / ESTILO GENERAL ==== */
body {
  background-color: #121212;
  color: #e0e0e0;
}

/* Inputs y selects más claros y estéticos */
input.form-control,
select.form-select {
  background-color: #1e1e1e !important;
  color: #ffffff !important;
  border: 1px solid #444 !important;
}

input.form-control::placeholder {
  color: #b8b8b8 !important;
}

select.form-select option {
  background-color: #1e1e1e;
  color: #fff;
}

/* Botón agregar producto */
#btnAgregar {
  background-color: #3a7afe !important;
  border: none;
}

/* Lista de productos agregados */
#listaProductos .list-group-item {
  background-color: #1b1b1b !important;
  color: #ffffff;
  border: 1px solid #333;
}

#listaProductos .btn-danger {
  background-color: #b40000 !important;
  border: none;
}

/* Tabla de pedidos */
table.table {
  color: #fff;
}

table.table thead {
  background-color: #222;
}

table.table tbody tr {
  background-color: #1b1b1b;
}

table.table tbody tr:hover {
  background-color: #242424;
}

/* Badges */
.badge.bg-success {
  background-color: #28a745 !important;
}

.badge.bg-warning {
  background-color: #ffcc00 !important;
  color: #000 !important;
}

.badge.bg-secondary {
  background-color: #555 !important;
}

/* Botones de estado */
.btn-warning {
  background-color: #ffc107 !important;
  border: none;
}

.btn-success {
  background-color: #28a745 !important;
  border: none;
}

  </style>
</head>
<body>
  <nav class="navbar navbar-expand-lg navbar-dark sticky-top">
    <div class="container-fluid">
      <a class="navbar-brand" href="dashboard.html"><span class="text-warning">🍹 Panel de Bar</span></a>
      <div class="d-flex align-items-center">
        <span class="navbar-text me-3 text-white-50">Gestión de Pedidos</span>
        <button id="logout" class="btn btn-danger">Cerrar sesión</button>
      </div>
    </div>
  </nav>

  <main class="container my-5">
    <div class="page-container">
      <h1 class="text-warning text-center mb-4">🍻 Gestión de Pedidos</h1>

      <div class="card p-4 mb-5">
        <h4 class="text-warning mb-3">Registrar nuevo pedido</h4>

        <form id="formPedido" class="row g-3" autocomplete="off">
          <div class="col-md-3">
            <label class="form-label">Mesa</label>
            <input id="id_mesa" name="id_mesa" type="number" class="form-control" placeholder="Número de mesa" required />
          </div>
          <div class="col-md-3">
            <label class="form-label">Mesero (ID)</label>
            <input id="id_mesero" name="id_mesero" type="number" class="form-control" placeholder="ID del mesero" required />
          </div>
          <div class="col-md-3">
            <label class="form-label">Producto</label>
            <select id="selectProducto" name="id_producto" class="form-select" required>
              <option value="">Cargando productos...</option>
            </select>
          </div>
          <div class="col-md-3">
            <label class="form-label">Cantidad</label>
            <input id="cantidad" name="cantidad" type="number" min="1" class="form-control" placeholder="Cantidad" required />
          </div>

          <div class="col-12 d-flex justify-content-end pt-3">
            <button type="button" id="btnAgregar" class="btn btn-primary me-2 fw-bold">➕ Agregar producto</button>
            <button type="submit" class="btn btn-warning fw-bold">💾 Registrar pedido</button>
          </div>
        </form>

        <div class="mt-4 border-top pt-3 border-secondary">
          <h5 class="text-warning">Productos del pedido:</h5>
          <ul id="listaProductos" class="list-group"></ul>
        </div>
      </div>

      <h3>📋 Pedidos Registrados</h3>
      <table class="table table-dark table-striped table-hover mt-3">
        <thead>
          <tr>
            <th>ID</th><th>Mesa</th><th>Mesero</th><th>Total</th><th>Estado</th><th>Acción</th>
          </tr>
        </thead>
        <tbody id="tablaPedidos"></tbody>
      </table>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="pedidos.js"></script>
  <script>
    document.getElementById("logout")?.addEventListener("click", () => {
      localStorage.clear();
      window.location.href = "login.html";
    });
  </script>
</body>
</html>
