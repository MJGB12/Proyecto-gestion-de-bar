<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestión de Usuarios - Bar 🍹</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-T3c6CoIi6uLrA9TneNEoa7RxnatzjcDSCmG1MXxSR1GAsXEV/Dwwykc2MPK8M2HN" crossorigin="anonymous">
    
    <style>
        /* Estilos base para el fondo (igual que el panel principal) */
        body {
            background-image: url('./img/fondo.jpg'); 
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            min-height: 100vh;
        }

        /* Estilo para el encabezado/barra de navegación */
        .navbar {
            background-color: rgba(10, 10, 10, 0.95) !important; 
            border-bottom: 3px solid #ffc107; 
        }

        /* Estilo para el contenedor principal de la página */
        .page-container {
            background-color: rgba(0, 0, 0, 0.75);
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 0 20px rgba(0, 0, 0, 0.5);
        }

        /* Estilo para la tarjeta del formulario */
        .form-card {
            background-color: rgba(30, 30, 30, 0.9);
            color: #ffffff;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        /* Estilo para los inputs y selects base */
        .form-control, .form-select {
            background-color: rgba(255, 255, 255, 0.1);
            color: #ffffff;
            border-color: rgba(255, 255, 255, 0.2);
        }
        .form-control::placeholder {
            color: rgba(255, 255, 255, 0.5);
        }
        .form-control:focus, .form-select:focus {
            background-color: rgba(255, 255, 255, 0.15);
            color: #ffffff;
            box-shadow: 0 0 0 0.25rem rgba(255, 193, 7, 0.5); 
            border-color: #ffc107;
        }
        
        /* >>> MODIFICACIÓN CLAVE: Estilos para el desplegable del SELECT <<< */
        /* Fondo de las opciones para que sean oscuras y legibles */
        .form-select option {
            background-color: #333; /* Fondo oscuro para las opciones */
            color: #fff; /* Texto blanco */
            padding: 5px;
        }
        
        /* Encabezado de la tabla para mejor contraste */
        .table-dark thead th {
            background-color: #ffc107; /* Color de acento amarillo */
            color: #000000; 
            border-bottom: none;
        }
    </style>

</head>
<body class="bg-dark text-light">
    
    <nav class="navbar navbar-expand-lg navbar-dark sticky-top">
        <div class="container-fluid">
            <a class="navbar-brand" href="dashboard.html">
                <span class="text-warning">🍹 Panel de Bar</span>
            </a>
            <div class="d-flex align-items-center">
                <span class="navbar-text me-3 text-white-50">Gestión de Usuarios</span>
                <button id="logout" class="btn btn-danger">Cerrar sesión</button>
            </div>
        </div>
    </nav>

    <main class="container my-5">
        <div class="page-container">

            <h1 class="mb-4 text-warning text-center">Gestión de Usuarios</h1>

            <div class="card form-card p-4 mb-5 shadow-lg">
                <h4 class="card-title text-white mb-3">Registrar / Editar Usuario</h4>
                <form id="formUsuario" class="row g-3">
                    <div class="col-md-3">
                        <input type="text" id="nombre_usuario" class="form-control" placeholder="Nombre de usuario" required>
                    </div>
                    <div class="col-md-2">
                        <input type="text" id="documento" class="form-control" placeholder="Documento" required>
                    </div>
                    <div class="col-md-2">
                        <input type="password" id="contrasenia" class="form-control" placeholder="Contraseña" required>
                    </div>
                    
                    <div class="col-md-2">
                        <select id="rol" class="form-select form-control" required>
                            <option value="" disabled selected>Selecciona Rol</option>
                            <option value="1">1 - Administrador</option>
                            <option value="2">2 - Cajero</option>
                            <option value="3">3 - Mesero</option>
                        </select>
                    </div>
                    
                    <div class="col-md-2">
                        <select id="sede" class="form-select form-control" required>
                            <option value="" disabled selected>Selecciona Sede</option>
                            <option value="1">1 - Restrepo</option>
                            <option value="2">2 - Calle 95</option>
                            <option value="3">3 - Parkway</option>
                        </select>
                    </div>

                    <div class="col-md-1 d-grid">
                        <button type="submit" class="btn btn-warning fw-bold">Guardar</button>
                    </div>
                </form>
            </div>

            <h3 class="mb-3 text-white">Listado de Personal</h3>
            <table class="table table-dark table-striped table-hover shadow-lg" id="tablaUsuarios">
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Nombre</th>
                        <th>Documento</th>
                        <th>Rol</th>
                        <th>Sede</th>
                        <th>Acciones</th>
                    </tr>
                </thead>
                <tbody>
                    <tr>
                        <td>1</td>
                        <td>admin_user</td>
                        <td>12345678</td>
                        <td>Administrador</td>
                        <td>1</td>
                        <td>
                            <button class="btn btn-sm btn-info me-2">Editar</button>
                            <button class="btn btn-sm btn-danger">Eliminar</button>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js" integrity="sha384-C6RzsynM9kWDrMNeT87bh95OGNyZPhcTNXj1NW7RuBCsyN/o0jlpcV8Qyq46cDfL" crossorigin="anonymous"></script>
    <script src="./js/usuarios.js"></script>
    <script>
        // Lógica de logout (manteniendo la coherencia)
        document.getElementById("logout").addEventListener("click", () => {
            localStorage.clear();
            window.location.href = "login.html";
        });
    </script>
</body>
</html>
