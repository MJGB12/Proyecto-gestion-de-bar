<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestión de Usuarios - Bar 🍹</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <link rel="stylesheet" href="./css/usuarios.css">    

</head>
<body class="bg-dark text-light">
    
    <nav class="navbar navbar-expand-lg navbar-dark sticky-top">
        <div class="container-fluid">
            <a class="navbar-brand" href="dashboard.html">
                <span class="text-warning">🍹 Panel de Bar</span>
            </a>
            <div class="d-flex align-items-center">
                <span class="navbar-text me-3 text-white-50">Gestión de Usuarios</span>
                <button id="logout" class="btn btn-danger">Cerrar sesión</button>
            </div>
        </div>
    </nav>

    <main class="container my-5">
        <div class="page-container">

            <h1 class="mb-4 text-warning text-center">Gestión de Usuarios</h1>

            <div class="card form-card p-4 mb-5 shadow-lg">
                <h4 class="card-title text-white mb-3">Registrar / Editar Usuario</h4>
                <form id="formUsuario" class="row g-3">
                    <div class="col-md-3">
                        <input type="text" id="nombre_usuario" class="form-control" placeholder="Nombre de usuario" required>
                    </div>
                    <div class="col-md-2">
                        <input type="text" id="documento" class="form-control" placeholder="Documento" required>
                    </div>
                    <div class="col-md-2">
                        <input type="password" id="contrasenia" class="form-control" placeholder="Contraseña" required>
                    </div>
                    
                    <div class="col-md-2">
                        <select id="rol" class="form-select form-control" required>
                            <option value="" disabled selected>Selecciona Rol</option>
                            <option value="1">1 - Administrador</option>
                            <option value="2">2 - Cajero</option>
                            <option value="3">3 - Mesero</option>
                        </select>
                    </div>
                    
                    <div class="col-md-2">
                        <select id="sede" class="form-select form-control" required>
                            <option value="" disabled selected>Selecciona Sede</option>
                            <option value="1">1 - Restrepo</option>
                            <option value="2">2 - Calle 95</option>
                            <option value="3">3 - Parkway</option>
                        </select>
                    </div>

                    <div class="col-md-1 d-grid">
                        <button type="submit" class="btn btn-warning fw-bold">Guardar</button>
                    </div>
                </form>
            </div>

            <h3 class="mb-3 text-white">Listado de Personal</h3>
            <table class="table table-dark table-striped table-hover shadow-lg" id="tablaUsuarios">
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Nombre</th>
                        <th>Documento</th>
                        <th>Rol</th>
                        <th>Sede</th>
                        <th>Acciones</th>
                    </tr>
                </thead>
                <tbody>
                    <tr>
                        <td>1</td>
                        <td>admin_user</td>
                        <td>12345678</td>
                        <td>Administrador</td>
                        <td>1</td>
                        <td>
                            <button class="btn btn-sm btn-info me-2">Editar</button>
                            <button class="btn btn-sm btn-danger">Eliminar</button>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
    <script src="./js/logout.js"></script>
</body>
</html>
