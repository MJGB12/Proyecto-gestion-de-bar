<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acceso al Panel - Bar 🍹</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-T3c6CoIi6uLrA9TneNEoa7RxnatzjcDSCmG1MXxSR1GAsXEV/Dwwykc2MPK8M2HN" crossorigin="anonymous">
    <link rel="stylesheet" href="./css/login.css">
    
</head>

<body>
    <div class="login-container">

        <img src="./img/logo.jpg" alt="Logo del Bar" class="logo-bar"> 

        <div class="card-login shadow-lg">
            <h4>Acceso de Personal</h4>
            <form id="formLogin">
                <div class="mb-3 text-start">
                    <label for="documento" class="form-label">Documento de Usuario</label>
                    <input type="text" class="form-control" id="documento" required>
                </div>
                <div class="mb-4 text-start">
                    <label for="contrasenia" class="form-label">Contraseña</label>
                    <input type="password" class="form-control" id="contrasenia"
                           autocomplete="current-password" required>
                </div>
                <button type="submit" class="btn btn-ingresar w-100">Ingresar al Sistema</button>
            </form>
            <div id="mensaje" class="mt-4 text-center text-danger fw-bold"></div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js" integrity="sha384-C6RzsynM9kWDrMNeT87bh95OGNyZPhcTNXj1NW7RuBCsyN/o0jlpcV8Qyq46cDfL" crossorigin="anonymous"></script>
    <script src="./js/login.js"></script>
</body>
</html>
