<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acceso al Panel - Bar 🍹</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-9ndCyUaIbzAi2FUVXJi0CjmCapSmO7SnpJef0486qhLnuZ2cdeRhO02iuK6FUUVM" crossorigin="anonymous">

    <style>
        /* 1. Fondo general de Bar (oscuro y ambiental) */
        body {
            background-image: url('./img/fondo.jpg'); 
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            overflow: hidden; 
        }

        /* 2. Contenedor principal para el logo y la tarjeta */
        .login-container {
            display: flex;
            flex-direction: column;
            align-items: center; 
            justify-content: center;
            width: 100%; 
            max-width: 400px; 
            /* *** CAMBIO CLAVE para subir el conjunto (Logo + Card) *** */
            transform: translateY(-80px); /* Mueve todo el conjunto 80px hacia arriba */
        }

        /* 3. Tarjeta del Formulario (Dark/Semitransparente) */
        .card-login {
            background-color: rgba(0, 0, 0, 0.85); 
            border-radius: 15px;
            padding: 40px; 
            box-shadow: 0 4px 25px rgba(255, 193, 7, 0.3);
            width: 100%; 
            max-width: 380px; 
            color: #ffffff;
            border: 1px solid rgba(255, 255, 255, 0.1);
            position: relative; 
            /* ELIMINAMOS O REDUCIMOS EL 'top' NEGATIVO AQUÍ */
            top: 0; 
        }

        /* Título */
        h4 {
            color: #ffc107;
            font-weight: 700;
            margin-bottom: 30px;
            text-transform: uppercase;
        }

        /* 4. Estilo de Inputs */
        .form-control {
            background-color: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: #ffffff;
        }
        .form-control::placeholder {
            color: rgba(255, 255, 255, 0.5);
        }
        .form-control:focus {
            background-color: rgba(255, 255, 255, 0.15);
            color: #ffffff;
            box-shadow: 0 0 0 0.25rem rgba(255, 193, 7, 0.5); 
            border-color: #ffc107;
        }

        /* 5. Estilo del Botón de Ingreso */
        .btn-ingresar {
            background-color: #ffc107;
            border-color: #ffc107;
            color: #000000;
            font-weight: bold;
            padding: 10px;
            transition: background-color 0.3s ease;
        }
        .btn-ingresar:hover {
            background-color: #e0a800;
            border-color: #e0a800;
            color: #000000;
        }

        /* 6. Ajustes del Logo */
        .logo-bar {
            width: 200px; 
            height: auto;
            /* *** CAMBIO CLAVE para DESPEGAR del card *** */
            margin-bottom: 40px; /* Margen positivo para separar el logo de la tarjeta */
            z-index: 10; 
            position: relative; 
        }
    </style>
</head>

<body>
    <div class="login-container">

        <img src="./img/logo.jpg" alt="Logo del Bar" class="logo-bar"> 

        <div class="card-login shadow-lg">
            <h4>Acceso de Personal</h4>
            <form id="formLogin">
                <div class="mb-3 text-start">
                    <label for="documento" class="form-label">Documento de Usuario</label>
                    <input type="text" class="form-control" id="documento" required>
                </div>
                <div class="mb-4 text-start">
                    <label for="contrasenia" class="form-label">Contraseña</label>
                    <input type="password" class="form-control" id="contrasenia" required>
                </div>
                <button type="submit" class="btn btn-ingresar w-100">Ingresar al Sistema</button>
            </form>
            <div id="mensaje" class="mt-4 text-center text-danger fw-bold"></div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js" integrity="sha384-geWF76RCwLtnZ8qwWowPQNguL3RmwHVBC9FhGdlKrxdiJJigb/j/68SIy3Te4Bkz" crossorigin="anonymous"></script>
    <script src="./js/login.js"></script>
</body>
</html>
